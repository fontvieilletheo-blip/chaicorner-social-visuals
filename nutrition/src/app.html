  if(s && s.full) return {i:s.i, u:DB.portion.get(s.i)||(best?best.u:100)};
  if(best) return {i:best.i, u:best.u};
  if(s) return {i:s.i, u:DB.portion.get(s.i)||100};

}
function suggest(q){
  if(!DB.ready||norm(q).length<2) return [];
  const out=[], seen=new Set(), qt=toks(q);
  for(const a of DB.alias) if(a.keys.some(k=>qt.every(t=>k.some(kt=>kt.startsWith(t)))) && !seen.has(a.i)){ seen.add(a.i); out.push({i:a.i,u:a.u}); if(out.length>=3) break; }
  for(const e of searchFoods(DB.idx,q,10,DB.groups)) if(!seen.has(e.i)){ seen.add(e.i); out.push({i:e.i,u:DB.portion.get(e.i)||100}); }

}

/* ================= Calculs ================= */
const JOB = {assis:1.2, mixte:1.35, physique:1.5};
const MET = {leger:4, mod:6, intense:8.5};
function compute(pr){
  const w=+pr.w||0, h=+pr.h||0, age=+pr.age||0, bf=+pr.bf||0;
  const bmr = bf>3 ? 370+21.6*w*(1-bf/100) : 10*w+6.25*h-5*age+(pr.sex==="h"?5:-161);
  const base = bmr*(JOB[pr.job]||1.2);
  const commute = 2.5*w*(+pr.commute||0)/60;
  const sport = (+pr.sessions||0)*(+pr.dur||0)/60*((MET[pr.intensity]||6)-1)*w/7;
  const tdee = (+pr.tdeeReal>800 ? +pr.tdeeReal : base+commute+sport);
  const adjPct = pr.goal==="perte" ? (pr.pace==="soutenu"?-0.20:-0.12) : pr.goal==="prise" ? (pr.pace==="soutenu"?0.12:0.07) : 0;
  let target = tdee*(1+adjPct);
  if (target<bmr) target=bmr;
  const bmi = h ? w/Math.pow(h/100,2) : 0;
  const refW = bmi>27 ? 25*Math.pow(h/100,2) : w;
  const pPerKg = pr.goal==="perte"?2 : pr.goal==="prise"?1.8 : 1.6;
  const p = pPerKg*refW;
  const l = Math.max(0.8*refW, target*0.30/9);
  const c = Math.max(0,(target-p*4-l*9)/4);
  const weekly = (target-tdee)*7/7700;
  const tw=+pr.targetW||0; let weeks=null;
  if(tw && weekly && Math.sign(tw-w)===Math.sign(weekly)) weeks=Math.ceil((tw-w)/weekly);
  return {bmr, base, commute, sport, tdee, target, p, l, c, fiber: Math.max(25, target/1000*14), bmi, pPerKg, refW, weekly, weeks, dayBase: base+commute, formula: base+commute+sport, water: pr.sex==="h"?2000:1600};
}
// Références nutritionnelles pour la population adulte (Anses, 2021) ; [valeur, "min" à atteindre | "max" à ne pas dépasser]
function refs(pr,c){
  const h=pr.sex==="h", mj=c.target*4.184/1000;
  return { ca:[+pr.age<25?1000:950,"min"], fe:[h||+pr.age>=50?11:16,"min"], mg:[h?380:300,"min"], k:[3500,"min"], zn:[h?11:9.3,"min"], ph:[550,"min"], i:[150,"min"], se:[70,"min"], cu:[h?1.9:1.5,"min"], mn:[h?2.8:2.5,"min"],
    va:[h?750:650,"min"], vd:[15,"min"], ve:[h?10:9,"min"], vk:[79,"min"], vc:[110,"min"], b1:[0.14*mj,"min"], b2:[1.6,"min"], b3:[1.6*mj,"min"], b5:[h?5.8:4.7,"min"], b6:[h?1.7:1.6,"min"], b9:[330,"min"], b12:[4,"min"],
    ala:[c.target*0.01/9,"min"], om3:[500,"min"], sat:[c.target*0.12/9,"max"], su:[100,"max"], sel:[5,"max"], alc:[20,"max"] };
}
function doshaOf(pr){ const q=pr.quiz||[]; if(q.filter(x=>x!=null).length<QUIZ.length) return null;
  const s=[0,0,0]; q.forEach(i=>s[i]++); const m=Math.max(...s); const names=["Vata","Pitta","Kapha"];
  const top=names.filter((_,i)=>s[i]===m); return {main:top[0], label:top.join("-"), s}; }
function mealPlan(pr){ const n=+pr.meals||3, f=pr.fast||"12";
  if(f==="16") return [["Déjeuner (repas principal)",.45],["Collation",.15],["Dîner",.40]];

  return [["Petit-déjeuner",.28],["Déjeuner (repas principal)",.42],["Dîner (léger, tôt)",.30]]; }

const NUMW = {un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,demi:0.5,demie:0.5};
function parseLine(seg){
  let s=" "+seg.trim().toLowerCase().replace(/(\d),(\d)/g,"$1.$2").replace(/1\/2/g,"0.5")+" ";
  let qty=null, unit=null, rest=s;
  const U="tranches?|bols?|verres?|tasses?|poign(?:é|e)es?|portions?|parts?|carr(?:é|e)s?|boules?|canettes?|pintes?|assiettes?";
  const m=s.match(new RegExp("(\\d+(?:\\.\\d+)?)\\s*(kg|grammes?|gr|g|ml|cl|l|c\\.?\\s?(?:à|a)\\s?s(?:oupe)?\\.?|cuill(?:è|e)res?\\s(?:à|a)\\ssoupe|c\\.?\\s?(?:à|a)\\s?c(?:af(?:é|e))?\\.?|cuill(?:è|e)res?\\s(?:à|a)\\scaf(?:é|e)|cas|cac|"+U+")?(?=\\s|$)"));
  if(m){ qty=+m[1]; unit=m[2]||null; rest=s.replace(m[0]," "); }
  else { const w=s.match(new RegExp("\\s(un|une|deux|trois|quatre|cinq|six|demi|demie)\\s+(?:("+U+")\\s)?"));
    if(w){ qty=NUMW[w[1]]; unit=w[2]||null; rest=s.replace(w[0]," "); } }
  const name=rest.replace(/\s(de|d'|du|des)\s/," ").trim() || seg.trim();
  const fd=resolveFood(name), fname=fd?DB.foods[fd.i][0]:"", fat=fd?(DB.foods[fd.i][2][KI.l]||0):0;
  let g; const u=(unit||"").replace(/\.|\s/g,"");
  if(/^(g|gr|gramme|grammes)$/.test(u)) g=qty;
  else if(u==="kg") g=qty*1000; else if(u==="ml") g=qty; else if(u==="cl") g=qty*10; else if(u==="l") g=qty*1000;
  else if(/^(cas|c[àa]s)/.test(u)||/soupe/.test(unit||"")) g=qty*(fat>60?12:15);
  else if(/^(cac|c[àa]c)/.test(u)||/caf/.test(unit||"")) g=qty*5;
  else if(/^bol/.test(u)||/^assiette/.test(u)) g=qty*300;
  else if(/^verre/.test(u)) g=qty*(/^Vin/.test(fname)?125:200);
  else if(/^tasse/.test(u)) g=qty*(/^Café exp/.test(fname)?50:200);
  else if(/^poign/.test(u)) g=qty*30; else if(/^carr/.test(u)) g=qty*10; else if(/^boule/.test(u)) g=qty*60;
  else if(/^canette/.test(u)) g=qty*330; else if(/^pinte/.test(u)) g=qty*500;
  else if(/^tranche/.test(u)) g=qty*(fd?Math.min(fd.u,40):30);
  else g=(qty==null?1:qty)*(fd?fd.u:150);
  g=Math.round(g);
  if(!fd) return {name:seg.trim(), g, n:new Array(NKEYS).fill(null), unknown:true, src:"?"};
  return {name:fname, g, n:vecOf(fd.i,g), src:"ciqual"};
}

function realTdee(){
  const ds=Object.keys(S.days).sort(), ws=ds.filter(d=>S.days[d].weight); if(ws.length<2) return null;
  const a=ws[0], b=ws.at(-1), span=(new Date(b)-new Date(a))/864e5; if(span<10) return null;
  const logged=ds.filter(d=>d>=a&&d<b&&totals(d).kcal>600); if(logged.length<Math.min(7,span*0.6)) return null;
  const intake=logged.reduce((s,d)=>s+totals(d).kcal,0)/logged.length;
  const dk=S.days[b].weight-S.days[a].weight;
  return {tdee:intake-dk*7700/span, intake, dk, span, n:logged.length};
}
function viewSuivi(){
  const pr=prof(), c=compute(pr), R=refs(pr,c), end=today();
  const dd=Array.from({length:7},(_,i)=>addDays(end,i-6)), ts=dd.map(d=>totals(d)), logged=ts.filter(t=>t.kcal>0), n=logged.length||1;
  const sum={n:new Array(NKEYS).fill(0)}; for(const t of logged) for(let i=0;i<NKEYS;i++) sum.n[i]+=t.n[i];
  const avg=k=>sum.n[KI[k]]/n, mx=Math.max(c.target*1.25,...ts.map(t=>t.kcal));
  const W=320,H=130,bw=30,gap=(W-7*bw)/8, y=v=>H-18-(v/mx)*(H-30);
  const bars=dd.map((d,i)=>{ const t=ts[i], x=gap+i*(bw+gap); const lab=new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"narrow"});
    return `<rect x="${x}" y="${y(t.kcal)}" width="${bw}" height="${Math.max(0,H-18-y(t.kcal))}" rx="2" fill="var(${t.kcal>c.target*1.05?"--amber":"--teal"})"/><text x="${x+bw/2}" y="${H-4}" text-anchor="middle" font-size="11" fill="var(--muted)">${lab}</text>${t.kcal?`<text x="${x+bw/2}" y="${y(t.kcal)-4}" text-anchor="middle" font-size="10" fill="var(--ink)">${r0(t.kcal)}</text>`:""}`; }).join("");
  const low=[]; if(logged.length) for(const [,list] of MICROS) for(const [k,lab,unit,src] of list){ if(KI[k]==null&&k!=="om3") continue; const [goal,type]=R[k]; if(type!=="min") continue; const v=val(sum,k)/n; if(v<goal*0.7) low.push([v/goal,lab,src,v,goal,unit]); }
  low.sort((a,b)=>a[0]-b[0]);
  const wd=Object.keys(S.days).sort().filter(d=>S.days[d].weight).slice(-30), ws=wd.map(d=>S.days[d].weight);
  let spark="";
  if(ws.length>1){ const mn=Math.min(...ws), mxw=Math.max(...ws), sp=(mxw-mn)||1, pts=ws.map((v,i)=>[10+i*(300/(ws.length-1)), 60-(v-mn)/sp*46]);
    spark=`<svg viewBox="0 0 320 72" width="100%" role="img" aria-label="Évolution du poids"><polyline fill="none" stroke="var(--teal)" stroke-width="2" points="${pts.map(p=>p.join(",")).join(" ")}"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--teal)"/>`).join("")}<text x="10" y="70" font-size="11" fill="var(--muted)">${ws[0]} kg</text><text x="310" y="70" font-size="11" text-anchor="end" fill="var(--ink)">${ws.at(-1)} kg</text></svg>`; }
  const rt=realTdee(), water=dd.reduce((s,d)=>s+((S.days[d]||{}).water||0),0)/7*0.25;
  return `${exampleBanner()}
  <section class="card">
    <div class="row" style="justify-content:space-between"><h2>Mes 7 derniers jours</h2><span class="tag">${logged.length} jour${logged.length>1?"s":""} noté${logged.length>1?"s":""}</span></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Calories par jour sur 7 jours, comparées à la cible"><line x1="0" x2="${W}" y1="${y(c.target)}" y2="${y(c.target)}" stroke="var(--fat)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W-2}" y="${y(c.target)-4}" text-anchor="end" font-size="10" fill="var(--fat)">cible ${r0(c.target)}</text>${bars}</svg>
    ${logged.length?`<div class="targets"><div><b>${r0(avg("kcal"))}</b><span>kcal / jour</span></div><div><b>${r0(avg("p"))}</b><span>g protéines</span></div><div><b>${r0(avg("c"))}</b><span>g glucides</span></div><div><b>${r0(avg("l"))}</b><span>g lipides</span></div></div>
    <p class="small muted num">Moyennes sur les jours notés. Cibles : ${r0(c.target)} kcal · P ${r0(c.p)} · G ${r0(c.c)} · L ${r0(c.l)}. Eau : ${water.toFixed(1).replace(".",",")} L par jour.</p>`:`<p class="empty">Note tes repas quelques jours : tes moyennes et tes points à surveiller apparaîtront ici.</p>`}
  </section>
  ${logged.length?`<section class="card cream">
    <h2>À surveiller cette semaine</h2>
    ${low.length?`<ul class="clean">${low.slice(0,5).map(([r,lab,src,v,g,u])=>`<li><b>${lab}</b> : ${r0(r*100)} % du repère (${r1(v)} / ${r1(g)} ${u}).${src?` Sources : ${src}.`:""}</li>`).join("")}</ul>`:`<p>Aucun micronutriment sous 70 % de son repère sur la semaine.</p>`}
    <details><summary>Tous les micronutriments (moyenne par jour)</summary><div class="micro">${microRows(sum,R,n)}</div></details>
    <p class="small muted">Lecture sur ${logged.length} jour${logged.length>1?"s":""} : un apport bas ponctuel n'est pas une carence. Si un nutriment reste bas plusieurs semaines, parles-en à un professionnel de santé avant tout complément.</p>
  </section>`:""}
  <section class="card">

  </section>
  <section class="card">

    :`<p>La formule estime ta dépense à <b class="num">${r0(c.formula)} kcal par jour</b>, à ±10 %. Avec au moins 10 jours entre deux pesées et 7 jours de repas notés, Agni calcule ta dépense réelle à partir de ce que tu manges et de l'évolution de ton poids, puis te propose d'ajuster tes cibles.</p>`}
  </section>`;
}

    <label class="f">Poids visé (kg) <span class="hint">facultatif</span><input id="p-targetW" data-p="targetW" type="number" inputmode="decimal" step="0.1" value="${p.targetW||""}"></label>
    ${c.weeks?`<p class="small muted num">À ce rythme, ${p.targetW} kg dans ${c.weeks} semaine${c.weeks>1?"s":""} environ.</p>`:(+p.targetW&&p.goal!=="maintien"&&!c.weeks?`<p class="small muted">Le poids visé ne va pas dans le sens de l'objectif choisi.</p>`:"")}
  </section>
  <section class="card"><h2>Ma constitution ayurvédique</h2>
    <p class="small muted">6 questions, facultatif. Réponds selon ta tendance de toujours, pas selon ton état du moment.</p>
    ${QUIZ.map(([q,as],i)=>`<div><h3>${q}</h3><div class="chips" style="margin-top:6px">${as.map((a,j)=>`<button class="chip" data-quiz="${i}:${j}" aria-pressed="${(p.quiz||[])[i]===j}">${a}</button>`).join("")}</div></div>`).join("")}
    ${d?`<p>Dominante : <b>${d.label}</b> <span class="muted small num">(Vata ${d.s[0]} · Pitta ${d.s[1]} · Kapha ${d.s[2]})</span></p>`:""}
  </section>
  <section class="card peach"><h2>Résultat du diagnostic</h2>
    <div class="targets"><div><b>${r0(c.bmr)}</b><span>métabolisme de base</span></div><div><b>${r0(c.tdee)}</b><span>dépense / jour</span></div><div><b>${r0(c.target)}</b><span>cible kcal</span></div><div><b>${c.bmi.toFixed(1).replace(".",",")}</b><span>IMC</span></div></div>
    <p class="num">Protéines ${r0(c.p)} g · Glucides ${r0(c.c)} g · Lipides ${r0(c.l)} g</p>
    <div class="row"><button class="btn primary" data-act="saveprofile">Enregistrer mon profil</button><span class="small" id="psaved" aria-live="polite">${esc(S.note)}</span></div>
  </section>
  ${AI.needsCode?`<section class="card"><h2>Code d'accès</h2><p class="small muted">Il active l'estimation par photo et les idées de repas sur cet appareil.</p>
    <div class="row"><div class="grow"><input id="code" type="password" autocomplete="off" placeholder="Code reçu" value="${esc(AI.code||"")}" aria-label="Code d'accès"></div><button class="btn" data-act="code">Valider</button></div></section>`:""}
  <section class="plain">
    <p class="small muted">${store.col?"Tes données sont rangées dans ton espace personnel de cette page, invisible pour les autres.":"Tes données restent sur cet appareil : rien n'est envoyé à un serveur, sauf le texte ou la photo d'un repas quand tu demandes une estimation."} Chaque personne a son propre profil et son propre journal.</p>
    ${STANDALONE?`<div class="row"><button class="btn" data-act="export">Sauvegarder mes données</button><label class="btn" style="display:inline-flex;align-items:center">Restaurer<input type="file" id="import" accept="application/json" hidden></label></div>`:""}
    ${S.confirmReset?`<div class="banner warn">Effacer ton profil et tout ton journal ? <div class="row" style="margin-top:8px"><button class="btn" data-act="reset-yes">Oui, tout effacer</button><button class="btn ghost" data-act="reset-no">Annuler</button></div></div>`:`<div><button class="btn ghost" data-act="reset">Effacer mes données</button></div>`}
  </section>`;
}

const TABS=["journal","suivi","plan","profil"];
function render(keepFocus){
  const act=document.activeElement, fid=keepFocus&&act&&act.id, pos=fid&&act.selectionStart;
  const md=$("#micro"); if(md) S.microOpen=md.open;
  $("#view").innerHTML = S.tab==="plan"?viewPlan() : S.tab==="profil"?viewProfil() : S.tab==="suivi"?viewSuivi() : viewJournal();
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===S.tab?"page":"false"));
  if(fid){ const el=document.getElementById(fid); if(el){ el.focus(); try{ if(pos!=null) el.setSelectionRange(pos,pos);}catch(e){} } }
}
function go(tab){ S.tab=tab; S.note=""; S.busy=""; if(tab!=="profil") S.draftProfile=null; S.confirmReset=false;
  if(location.hash!=="#"+tab) location.hash=tab; render(); window.scrollTo(0,0); }

/* ================= Claude (facultatif) ================= */
// Dans l'artefact : capacité « sample ». Sur le site : petit relais serveur /api/claude (voir functions/api/claude.js).
const AI = {ok:false,img:false,needsCode:false,code:null,
  async json(prompt, blob){ const t=await this.text(prompt,{blob}); const m=t.match(/\[[\s\S]*\]/); return JSON.parse(m?m[0]:t); },
  async text(prompt, o={}){
    if(this.sample){ const opts={cache:false}; if(o.blob) opts.images=[o.blob]; if(o.onText) opts.onText=({text})=>o.onText(text); if(o.quick) opts.modelTier="quick";
      return (await this.sample(prompt,opts)).text; }
    const body={prompt, code:this.code||""};
    if(o.blob){ const b64=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(o.blob); }); body.image={media_type:o.blob.type||"image/jpeg", data:b64}; }
    const r=await fetch("api/claude",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
    if(r.status===401) throw {code:"bad_code"}; if(r.status===429) throw {code:"rate_limited"}; if(!r.ok) throw {code:"failed"};
    const t=(await r.json()).text||""; if(o.onText) o.onText(t); return t; } };
const aiErr = e => e&&e.code==="not_granted" ? "Claude n'est pas autorisé sur cette page : la saisie par texte reste disponible."
  : e&&e.code==="bad_code" ? "Code d'accès manquant ou incorrect : renseigne-le dans Profil."
  : e&&e.code==="rate_limited" ? "Trop de demandes d'un coup. Réessaie dans une minute." : e&&e.code==="cancelled" ? "" : "L'estimation n'a pas abouti. Réessaie ou saisis le repas à la main.";
const EST = `Tu es un outil d'estimation nutritionnelle pour une application française. Décompose le repas en aliments simples (ingrédients), y compris les matières grasses de cuisson et les sauces. Pour chaque aliment, donne un nom générique court tel qu'on le trouve dans la table Ciqual de l'Anses (exemples : "riz basmati cuit", "poulet filet grillé", "huile d'olive", "lentilles corail cuites", "comté"), la quantité consommée en grammes, et les valeurs POUR CETTE QUANTITÉ. Réponds UNIQUEMENT par un tableau JSON, sans texte autour : [{"name":"...","g":nombre,"kcal":nombre,"p":nombre,"c":nombre,"l":nombre,"f":nombre}] où p = protéines, c = glucides, l = lipides, f = fibres, en grammes. Si l'image ou le texte ne montre aucun aliment, réponds [].`;
// Chaque aliment estimé est rapproché de la table Ciqual pour récupérer ses micronutriments ; sinon on garde l'estimation de Claude (macros seules).
function fromAI(x){ const g=Math.round(+x.g)||0, name=String(x.name||"Aliment").slice(0,60), fd=g?resolveFood(name):null;
  if(fd){ const k100=DB.foods[fd.i][2][0], ai100=(+x.kcal||0)/g*100; if(k100>0 && ai100>0 && Math.abs(k100-ai100)/Math.max(k100,ai100)<0.4) return {name:DB.foods[fd.i][0], g, n:vecOf(fd.i,g), src:"ciqual"}; }
  const n=new Array(NKEYS).fill(null); n[0]=+x.kcal||0;n[1]=+x.p||0;n[2]=+x.c||0;n[3]=+x.l||0;n[4]=+x.f||0; return {name, g, n, src:"ia"}; }
async function estimate(text, blob){
  S.busy = blob ? "Claude regarde la photo…" : "Claude estime le repas…"; S.note=""; render();
  try{ const arr = await AI.json(EST+"\n\nRepas : "+(text||"voir la photo jointe"), blob);
    if(!Array.isArray(arr)||!arr.length){ S.note="Aucun aliment reconnu. Décris le plat en quelques mots et réessaie."; }
    else { addItems(arr.map(fromAI)); S.draft=""; S.note=arr.length+" aliment(s) ajouté(s). Corrige les grammes si besoin : tout se recalcule."; }
  }catch(e){ S.note=aiErr(e); }
  S.busy=""; render();
}
async function shrink(file){
  try{ const bmp=await createImageBitmap(file); const k=Math.min(1,1280/Math.max(bmp.width,bmp.height));
    const cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),"image/jpeg",0.85)); }catch(e){ return file; }
}
function context(){ const pr=prof(), c=compute(pr), m=new Date().getMonth(), d=doshaOf(pr), ritu=RITU(m), f=FASTS[pr.fast||"12"];
  return `Profil : ${pr.sex==="h"?"homme":"femme"}, ${pr.age} ans, ${pr.w} kg, alimentation ${pr.diet}, objectif ${pr.goal}, ${mealPlan(pr).length} prises alimentaires par jour${f[1]?", fenêtre alimentaire "+f[1]:""}.${pr.notes?" Contraintes et habitudes : "+String(pr.notes).slice(0,300)+".":""} Cibles du jour : ${r0(c.target)} kcal, ${r0(c.p)} g protéines, ${r0(c.c)} g glucides, ${r0(c.l)} g lipides, ${r0(c.fiber)} g fibres. Mois : ${MONTHS[m]} en France. Légumes de saison : ${SEASON[m][0]}. Fruits de saison : ${SEASON[m][1]}. Ayurveda : saison ${ritu.d}${d?", constitution dominante "+d.label:""}.`; }
async function askPlan(){
  S.planText="Claude réfléchit…"; S.note=""; render();
  const mp=mealPlan(prof()).map(m=>m[0]).join(", ");
  try{ S.planText = await AI.text(`${context()}\n\nCompose une journée type en français, en tutoyant, avec ces prises : ${mp}. Utilise surtout des produits de saison achetables en France et respecte les principes ayurvédiques de la saison${doshaOf(prof())?" et de la constitution":""} (plats chauds et cuits si Vata, etc.), sans sacrifier les cibles. Veille à la densité en micronutriments (fer, calcium, magnésium, folates, vitamine C, oméga-3). Pour chaque repas : les aliments avec leurs grammes, puis une ligne "≈ kcal · P · G · L". Termine par le total du jour comparé aux cibles (écart toléré : 5 %). Texte brut, sans markdown, pas d'introduction.`,
      {onText:text=>{ S.planText=text; const o=document.getElementById("plan-out"); if(o){o.hidden=false;o.textContent=text;} }});
  }catch(e){ S.planText=(e&&e.text)||""; S.note=aiErr(e); if(S.note) S.planText=S.note; }
  render();
}
async function askAdvice(){
  const t=totals(), D=day(), R=refs(prof(),compute(prof())); S.advice="Claude réfléchit…"; render();
  const lows=MICROS.flatMap(g=>g[1]).filter(([k])=>R[k][1]==="min"&&(KI[k]!=null||k==="om3")&&val(t,k)<R[k][0]*0.5).map(x=>x[1]).slice(0,6).join(", ");
  try{ S.advice = await AI.text(`${context()}\n\nDéjà mangé aujourd'hui (${r0(t.kcal)} kcal, P ${r0(t.p)} g, G ${r0(t.c)} g, L ${r0(t.l)} g, fibres ${r0(t.f)} g) : ${D.meals.map(m=>m.name+" "+m.g+" g").join(", ")||"rien"}.${lows?" Micronutriments encore bas aujourd'hui : "+lows+".":""} Il est ${new Date().getHours()} h.\n\nPropose en français, en tutoyant, UNE idée concrète pour le prochain repas (aliments de saison, grammes, kcal et macros approximatives) qui rapproche des cibles restantes et des micronutriments bas, cohérente avec l'ayurveda de la saison. 5 lignes maximum, texte brut sans markdown.`, {quick:true});
  }catch(e){ S.advice=aiErr(e); }
  render();
}

/* ================= Open Food Facts (site uniquement) ================= */
const OFFMAP = {kcal:["energy-kcal_100g",1],p:["proteins_100g",1],c:["carbohydrates_100g",1],l:["fat_100g",1],f:["fiber_100g",1],su:["sugars_100g",1],sat:["saturated-fat_100g",1],sel:["salt_100g",1],
  ca:["calcium_100g",1000],fe:["iron_100g",1000],mg:["magnesium_100g",1000],k:["potassium_100g",1000],zn:["zinc_100g",1000],ph:["phosphorus_100g",1000],vc:["vitamin-c_100g",1000],vd:["vitamin-d_100g",1e6],b12:["vitamin-b12_100g",1e6],b9:["vitamin-b9_100g",1e6],va:["vitamin-a_100g",1e6],ve:["vitamin-e_100g",1000]};
function offProduct(p){ const nu=p.nutriments||{}; if(nu["energy-kcal_100g"]==null) return null; const n100=new Array(NKEYS).fill(null);
  for(const k in OFFMAP) if(KI[k]!=null && nu[OFFMAP[k][0]]!=null) n100[KI[k]]=+nu[OFFMAP[k][0]]*OFFMAP[k][1];
  return {name:[p.product_name_fr||p.product_name||"Produit",p.brands?"("+String(p.brands).split(",")[0]+")":""].join(" ").trim().slice(0,70), g:Math.round(+p.serving_quantity)||100, n100}; }
async function offSearch(){
  const q=S.offq.trim(); if(!q) return; S.busy="Recherche du produit…"; S.note=""; S.off=[]; render();
  const F="product_name,product_name_fr,brands,nutriments,serving_quantity";
  try{ let list=[];
    if(/^\d{8,14}$/.test(q)){ const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${q}.json?fields=${F}`); const d=await r.json(); if(d.product) list=[d.product]; }
    else { const r=await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=8&cc=fr&lc=fr&fields=${F}`); list=(await r.json()).products||[]; }
    S.off=list.map(offProduct).filter(Boolean); S.note=S.off.length?"":"Produit introuvable ou sans valeurs nutritionnelles.";
  }catch(e){ S.note="Open Food Facts ne répond pas. Réessaie plus tard."; }
  S.busy=""; render();
}

/* ================= Actions ================= */
function addItems(items){ const slot=curSlot(), D=day(); for(const it of items) D.meals.push({id:uid(), slot, ...it}); saveDay(); }
document.addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.tab) return go(b.dataset.tab);
  if(b.dataset.go) return go(b.dataset.go);
  if(b.dataset.day){ const n=addDays(S.date,+b.dataset.day); if(n<=today()){S.date=n;S.note="";S.advice="";render();} return; }
  if(b.dataset.slot){ S.slot=b.dataset.slot; return render(); }
  if(b.dataset.pick){ const i=+b.dataset.pick, g=+b.dataset.u; addItems([{name:DB.foods[i][0], g, n:vecOf(i,g), src:"ciqual"}]); S.q=""; S.note="Ajouté. Ajuste les grammes dans la liste."; return render(); }
  if(b.dataset.recent){ const m=recents()[+b.dataset.recent]; if(m) addItems([{name:m.name,g:m.g,n:m.n.slice(),src:m.src}]); return render(); }
  if(b.dataset.off){ const p=S.off[+b.dataset.off]; addItems([{name:p.name,g:p.g,n:p.n100.map(v=>v==null?null:v*p.g/100),src:"off"}]); S.off=[]; S.offq=""; S.note="Produit ajouté. Ajuste les grammes dans la liste."; return render(); }
  if(b.dataset.del){ const D=day(); D.meals=D.meals.filter(m=>m.id!==b.dataset.del); saveDay(); return render(); }
  if(b.dataset.delact){ const D=day(); D.acts=D.acts.filter(m=>m.id!==b.dataset.delact); saveDay(); return render(); }
  if(b.dataset.quiz){ const [i,j]=b.dataset.quiz.split(":").map(Number); const p=S.draftProfile; p.quiz=p.quiz||[]; p.quiz[i]=j; for(let k=0;k<QUIZ.length;k++) if(p.quiz[k]===undefined) p.quiz[k]=null; return render(); }
  const a=b.dataset.act; if(!a) return;
  if(a==="add"){ const t=S.draft.trim(); if(!t){S.note="Écris d'abord ce que tu as mangé.";return render();}
    const items=parseText(t); addItems(items); const unk=items.filter(i=>i.unknown).length; S.draft="";
    S.note=unk? unk+" aliment(s) non reconnu(s), affiché(s) en rouge."+(AI.ok?" Supprime-les et utilise « Estimer avec Claude » pour les plats composés.":" Cherche-les par leur nom dans la table.") : items.length+" aliment(s) ajouté(s)."; return render(); }
  if(a==="ia"){ const t=S.draft.trim(); if(!t){S.note="Écris d'abord ce que tu as mangé.";return render();} return estimate(t); }
  if(a==="photo") return $("#photo").click();
  if(a==="advice") return askAdvice();
  if(a==="plan") return askPlan();
  if(a==="off") return offSearch();
  if(a==="copyday"){ const y=S.days[addDays(S.date,-1)]; const D=day(); for(const m of y.meals) D.meals.push({...m,id:uid(),n:m.n.slice()}); saveDay(); return render(); }
  if(a==="water+"||a==="water-"){ const D=day(); D.water=Math.max(0,(D.water||0)+(a==="water+"?1:-1)); saveDay(); return render(); }
  if(a==="kichari"){ const K=kichari(); if(K){ S.date=today(); addItems([K]); } return go("journal"); }
  if(a==="addact"){ const i=+$("#act-type").value, min=+$("#act-min").value; if(!min) return; const w=+prof().w;
    day().acts.push({id:uid(), name:ACTS[i][0], min, kcal:(ACTS[i][1]-1)*w*min/60}); saveDay(); return render(); }
  if(a==="weight"){ const v=+$("#weight").value; if(!v) return; day().weight=v; saveDay(); return render(); }
  if(a==="usereal"){ if(!S.profile) return go("profil"); S.profile.tdeeReal=+b.dataset.v||0; store.save("profile",S.profile); return render(); }
  if(a==="saveprofile"){ const p=S.draftProfile; delete p.example; S.profile=JSON.parse(JSON.stringify(p)); store.save("profile",S.profile); S.note="Profil enregistré."; return render(); }
  if(a==="code"){ AI.code=$("#code").value.trim(); store.put("code",AI.code); S.note="Code enregistré."; return render(); }
  if(a==="export"){ const blob=new Blob([JSON.stringify({app:"agni",v:2,profile:S.profile,days:S.days})],{type:"application/json"}); const l=document.createElement("a"); l.href=URL.createObjectURL(blob); l.download="agni-"+today()+".json"; l.click(); return; }
  if(a==="reset"){ S.confirmReset=true; return render(); }
  if(a==="reset-no"){ S.confirmReset=false; return render(); }
  if(a==="reset-yes"){ const keys=Object.keys(S.days); S.profile=null; S.days={}; S.draftProfile=null; S.confirmReset=false;
    try{ localStorage.removeItem("agni:profile"); localStorage.removeItem("agni:days"); }catch(e){}
    if(store.col){ store.col.doc("profile").delete().catch(()=>{}); keys.forEach(k=>store.col.doc("d-"+k).delete().catch(()=>{})); }
    S.note="Données effacées."; return render(); }
});
document.addEventListener("input", e=>{
  const el=e.target;
  if(el.id==="draft"){ S.draft=el.value; return; }
  if(el.id==="offq"){ S.offq=el.value; return; }
  if(el.id==="q"){ S.q=el.value; return render(true); }
  if(el.dataset.p && S.draftProfile){ S.draftProfile[el.dataset.p]= el.type==="number" ? (el.value===""?"":+el.value) : el.value; S.note=""; if(el.tagName!=="TEXTAREA") render(true); }
});
document.addEventListener("change", e=>{
  const el=e.target;
  if(el.dataset.g){ const m=day().meals.find(x=>x.id===el.dataset.g); const g=Math.max(0,+el.value||0); if(!m) return;
    if(m.g>0&&!m.unknown){ const k=g/m.g; m.n=m.n.map(v=>v==null?null:v*k); } m.g=g; saveDay(); render(); }
  if(el.id==="photo" && el.files[0]){ const f=el.files[0]; el.value=""; shrink(f).then(b=>estimate(S.draft.trim(), b)); }
  if(el.id==="import" && el.files[0]){ el.files[0].text().then(t=>{ const d=JSON.parse(t); if(d.app!=="agni") throw 0; S.profile=d.profile||null; S.days=d.days||{}; Object.values(S.days).forEach(fixDay); store.put("profile",S.profile); store.put("days",S.days); S.draftProfile=null; S.note="Données restaurées."; render(); }).catch(()=>{ S.note="Ce fichier n'est pas une sauvegarde Agni."; render(); }); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.id==="offq"){ e.preventDefault(); offSearch(); } });
window.addEventListener("hashchange", ()=>{ const h=location.hash.slice(1); if(TABS.includes(h)&&h!==S.tab){ S.tab=h; S.draftProfile=null; render(); } });

/* ================= Démarrage ================= */
S.profile = store.get("profile"); S.days = store.get("days") || {}; Object.values(S.days).forEach(fixDay);
{ const h=location.hash.slice(1); S.tab = TABS.includes(h) ? h : (S.profile?"journal":"profil"); }
render(); loadDB();
(async()=>{
  if(STANDALONE){
    AI.code=store.get("code");
    try{ const r=await fetch("api/claude"); if(r.ok){ const d=await r.json(); if(d.ok){ AI.ok=true; AI.img=true; AI.needsCode=!!d.needsCode; render(true); } } }catch(e){}
    return;
  }
  claude.use("sample").then(async s=>{ if(!s) return; AI.sample=s; AI.ok=true; const lim=await s.limits().catch(()=>null); AI.img=!!(lim&&lim.images); render(true); });
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]); if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const col=db.collection("data/users/"+id), snap=await col.get();
    let remoteProfile=null; const remoteDays={};
    snap.docs.forEach(d=>{ if(d.id==="profile") remoteProfile=d.data(); else if(d.id.startsWith("d-")) remoteDays[d.id.slice(2)]=d.data(); });
    store.col=col;
    // Le compte fait foi ; ce qui n'existe que sur l'appareil est remonté.
    if(remoteProfile) { S.profile=remoteProfile; store.put("profile",S.profile); } else if(S.profile) store.save("profile",S.profile);
    for(const k of Object.keys(S.days)) if(!remoteDays[k] && (S.days[k].meals.length||S.days[k].acts.length||S.days[k].weight||S.days[k].water)) store.save("d-"+k,S.days[k]);
    for(const k of Object.keys(remoteDays)) S.days[k]=fixDay(remoteDays[k]);
    store.put("days",S.days); setSync("Synchronisé");
    if(!S.draft && !S.draftProfile && !S.q) { if(!location.hash && S.profile) S.tab="journal"; render(); } else render(true);
  }catch(e){ setSync("Sur cet appareil"); }
})();
</script>
