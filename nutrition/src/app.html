<title>Agni</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap">
<style>
/* Charte Chaï Corner (chaicorner.fr) : Bricolage Grotesque, bleu canard, pêche, sable, jaune, angles à 3 px, boutons en capitales à double cadre.
   Layout : app une colonne pensée téléphone, bandeau canard, barre d'onglets fixe en bas. Thème clair unique, comme le site. */
:root{
  color-scheme:light;
  --bg:#ffffff; --fg:#224147; --ink:#262b2c; --muted:#4f6b70;
  --teal:#224147; --teal-light:#43808c; --peach:#fcd8c9; --sand:#efe1d4; --sand-2:#e0cfbf; --cream:#faf4e8;
  --yellow:#ffdd57; --amber:#e2a145; --amber-dark:#a76d1a; --green:#3b5442; --charcoal:#292929; --line:#e0cfbf;
  --prot:#224147; --carb:#e2a145; --fat:#c0673f; --fiber:#43808c; --warn:#b4472a; --ok:#3b5442;
  --font:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:3px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;padding-block:0 104px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--teal)}
.band{background:var(--teal);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
.band .in,.page{max-width:580px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.band .in{display:flex;align-items:center;gap:10px;padding-block:12px;transition:padding .25s ease}
.band.small .in{padding-block:7px}
.band.small .brand small{display:none}
.band .flame{width:26px;height:26px;flex:none}
.brand{font-weight:600;font-size:24px;letter-spacing:-.01em;line-height:1}
.brand small{display:block;font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-top:3px;opacity:.85}
.page{display:flex;flex-direction:column;gap:16px;padding-block:16px 0}
#view{display:flex;flex-direction:column;gap:16px}
h2{font-weight:500;font-size:22px;letter-spacing:-.01em;line-height:1.15;margin:0;color:var(--ink);text-wrap:balance}
h3{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13.5px} .num{font-variant-numeric:tabular-nums}
section.card{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
section.card.peach{background:var(--peach);border-color:var(--peach)}
section.card.cream{background:var(--cream);border-color:var(--sand)}
section.plain{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row > .grow{flex:1;min-width:0}
.banner{background:var(--cream);border:1px solid var(--sand-2);padding:10px 12px;font-size:14px;border-radius:var(--r)}
.banner.warn{background:#fff;border-color:var(--warn)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:1px solid var(--teal);background:#fff;color:var(--teal);border-radius:var(--r);padding:9px 14px;font-weight:500;min-height:42px;text-transform:uppercase;letter-spacing:.04em;font-size:13.5px}
.btn.primary{background:var(--teal);color:#fff;box-shadow:4px 4px 0 0 #fff,4px 4px 0 1px var(--teal);margin:0 5px 5px 0}
.card.peach .btn.primary{box-shadow:4px 4px 0 0 var(--peach),4px 4px 0 1px var(--teal)}
.btn.ghost{background:transparent;border-color:transparent;text-decoration:underline;text-underline-offset:3px;padding-inline:4px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible,.chip:focus-visible,.x:focus-visible,.sug:focus-visible,summary:focus-visible{outline:2px solid var(--amber-dark);outline-offset:2px}
input,select,textarea{background:#fff;border:1px solid var(--teal-light);border-radius:var(--r);padding:9px 10px;min-height:42px;width:100%;min-width:0;color:var(--ink)}
textarea{resize:vertical;min-height:64px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:500;color:var(--fg);min-width:0}
label.f > span.hint{font-weight:400;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--teal);background:#fff;color:var(--teal);border-radius:var(--r);padding:6px 11px;font-size:13.5px;min-height:36px;text-align:left}
.chip[aria-pressed="true"]{background:var(--teal);color:#fff}
.chip .ic{width:16px;height:16px;vertical-align:-3px;margin-right:6px}
.tag{display:inline-block;background:var(--yellow);color:var(--teal);border-radius:var(--r);padding:3px 9px;font-size:12.5px;font-weight:600;letter-spacing:.03em}

.summary{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
@media (max-width:360px){.summary{grid-template-columns:1fr}}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:9px;min-width:0}
.bar .lab{display:flex;justify-content:space-between;font-size:13.5px;gap:8px}
.bar .track{height:8px;background:#fff;border-radius:99px;overflow:hidden;margin-top:3px;border:1px solid rgba(34,65,71,.15)}
.card:not(.peach) .bar .track{background:var(--cream)}
.bar .fill{height:100%;border-radius:99px}
.balance{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid rgba(34,65,71,.25);padding-top:12px}
.balance div{min-width:0}
.balance b{display:block;font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;color:var(--ink)}
.balance span{font-size:12.5px}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar .d{font-weight:500;font-size:22px;text-align:center;flex:1;color:var(--ink)}
.datebar button{width:42px;height:42px;border-radius:var(--r);border:1px solid var(--teal);background:#fff;font-size:18px;color:var(--teal)}
.datebar button:disabled{opacity:.35}
.slot{display:flex;flex-direction:column}
.slot-h{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0 4px;border-bottom:1px solid var(--teal)}
.item{display:grid;grid-template-columns:1fr 78px 34px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item .n{min-width:0}
.item .n b{font-weight:500;display:block;overflow-wrap:anywhere;color:var(--ink)}
.item .n span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.item input{padding:6px 8px;min-height:36px;text-align:right}
.item.unknown .n b{color:var(--warn)}
.x{width:34px;height:34px;border-radius:var(--r);border:none;background:transparent;color:var(--muted);font-size:20px;line-height:1}
.sugs{display:flex;flex-direction:column;border:1px solid var(--teal-light);border-radius:var(--r);overflow:hidden}
.sug{border:none;border-bottom:1px solid var(--line);background:#fff;text-align:left;padding:9px 10px;display:flex;justify-content:space-between;gap:10px;min-height:42px;align-items:center}
.sug:last-child{border-bottom:none}
.sug > span:first-child{min-width:0;overflow-wrap:anywhere;color:var(--ink)}
.sug > span:last-child{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.sug .nm > span:last-child{min-width:0;overflow-wrap:anywhere}
.empty{font-size:14px;color:var(--muted);padding:6px 0}
.out{white-space:pre-wrap;font-size:14.5px;background:var(--cream);border-radius:var(--r);padding:12px;overflow-wrap:anywhere;color:var(--ink)}
.split{height:14px;border-radius:99px;overflow:hidden;display:flex;background:var(--cream)}
.split i{display:block;height:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td:first-child,th:first-child{text-align:left}
th{font-size:12px;color:var(--green);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tw{overflow-x:auto}
.targets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.targets div{min-width:0}
.targets b{display:block;font-weight:600;font-size:23px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.targets span{font-size:12.5px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
details summary{cursor:pointer;font-weight:500;color:var(--ink)}
details[open] summary{margin-bottom:10px}
.micro{display:grid;grid-template-columns:1fr;gap:7px}
.mrow{display:grid;grid-template-columns:118px 1fr 92px;gap:8px;align-items:center;font-size:13.5px}
.mrow .track{height:7px;background:var(--cream);border-radius:99px;overflow:hidden;border:1px solid rgba(34,65,71,.12)}
.mrow .fill{height:100%;border-radius:99px}
.mrow .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.water{display:flex;gap:6px;flex-wrap:wrap}
.water i{width:22px;height:28px;border:1.5px solid var(--teal-light);border-radius:0 0 6px 6px;display:block}
.water i.on{background:var(--teal-light)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.illu{display:block;width:100%;max-width:220px;height:auto;margin:0 auto}
.illu.sm{max-width:120px;margin:0}
.withillu{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center}
.withillu > div{min-width:0;display:flex;flex-direction:column;gap:8px}
@media (max-width:360px){.withillu{grid-template-columns:1fr}}
.lead{font-size:17px;color:var(--ink)}
.hero-empty{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:8px 0 4px}
.advice{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;background:var(--cream);border-radius:var(--r);padding:12px;color:var(--ink)}
.advice .ic{color:var(--amber-dark);margin-top:1px}
.advice button{justify-self:start;grid-column:2}
.slot-h{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--teal)}
.slot-h .sl{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:500;font-size:17px}
.slot-h .sl .ic{color:var(--teal-light)}
.add{width:40px;height:40px;border:1px solid var(--teal);border-radius:var(--r);background:#fff;color:var(--teal);display:grid;place-items:center}
.add:focus-visible,.tile:focus-visible{outline:2px solid var(--amber-dark);outline-offset:2px}
.sh-act{display:flex;gap:2px}
.icb{width:34px;height:34px;border:none;background:transparent;color:var(--teal-light);border-radius:var(--r);display:grid;place-items:center}
.icb .ic{width:18px;height:18px}
.icb.on{color:var(--amber)}
.icb:focus-visible{outline:2px solid var(--amber-dark);outline-offset:2px}
.favs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.favs::-webkit-scrollbar{display:none}
.fav{flex:none;max-width:200px;border:1px solid var(--teal);border-radius:var(--r);background:#fff;color:var(--teal);padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:52px}
.fav b{font-weight:500;color:var(--ink);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.fav span{font-size:12px;color:var(--muted)}
.fav.del{border-color:var(--warn)}
.fav.del span{color:var(--warn)}
.fav:focus-visible{outline:2px solid var(--amber-dark);outline-offset:2px}
.hero-empty .favs{justify-content:center;flex-wrap:wrap;overflow:visible}
.foyer-row{display:grid;grid-template-columns:1fr auto 34px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--sand-2)}
.foyer-row b{display:block;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foyer-row > div{min-width:0}
.code{font-size:28px;font-weight:600;letter-spacing:.18em;color:var(--ink);font-variant-numeric:tabular-nums;user-select:all}
.slot .none{font-size:13.5px;color:var(--muted);padding:8px 0 4px}
.item{grid-template-columns:30px 1fr 70px 34px}
.item .n b,.item .n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.item .gi{width:30px;height:30px;border-radius:50%;background:var(--cream);display:grid;place-items:center;color:var(--teal)}
.item .gi .ic{width:18px;height:18px}
.sug .gi{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--cream);color:var(--teal);margin-right:8px;vertical-align:middle;flex:none}
.sug .gi .ic{width:16px;height:16px}
.sug .nm{display:flex;align-items:center;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:12px 10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;min-width:0;color:var(--fg)}
.tile .ic{color:var(--teal-light)}
.tile b{font-weight:600;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--muted)}
.toast{background:var(--teal);color:#fff;border-radius:var(--r);padding:9px 12px;font-size:14px}
.scrim{position:fixed;inset:0;background:rgba(38,43,44,.45);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:#fff;border-radius:14px 14px 0 0;max-height:88%;overflow:auto;box-shadow:0 -10px 40px rgba(38,43,44,.18);
  padding:14px max(16px, env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.sheet .in{max-width:580px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--sand-2);margin:0 auto}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.field-ic{position:relative}
.field-ic .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--teal-light);pointer-events:none}
.field-ic input{padding-left:40px}
.btn .ic{width:18px;height:18px;vertical-align:-4px;margin-right:6px}
.prog{height:4px;background:var(--cream);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal);border-radius:9px}
.stepno{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);font-weight:600}
details.acc{border-bottom:1px solid var(--line);padding:12px 0}
details.acc:first-of-type{border-top:1px solid var(--line)}
details.acc > summary{font-size:17px;display:flex;justify-content:space-between;gap:10px;list-style:none}
details.acc > summary::-webkit-details-marker{display:none}
details.acc > summary::after{content:"+";color:var(--teal-light);font-size:20px;line-height:1}
details.acc[open] > summary::after{content:"−"}
details.acc > summary span{font-size:13.5px;color:var(--muted);font-weight:400;margin-left:auto;text-align:right}
details.acc .body{display:flex;flex-direction:column;gap:12px}
.dosha{display:flex;align-items:center;gap:10px}
.dosha svg{width:44px;height:44px;flex:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--teal);
  padding:6px max(16px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:580px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);position:relative}
nav.tabs .ind{position:absolute;top:0;bottom:0;left:0;width:25%;padding:0 2px;pointer-events:none;transition:transform .45s cubic-bezier(.3,1.3,.4,1)}
nav.tabs .ind::before{content:"";display:block;height:100%;background:var(--teal);border-radius:var(--r)}
.tab{border:none;background:transparent;border-radius:var(--r);padding:7px 2px;font-weight:500;color:var(--muted);min-height:52px;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab{position:relative;transition:color .25s ease}
.tab[aria-current="page"]{color:#fff}
.tab .ic{transition:transform .35s cubic-bezier(.3,1.5,.4,1)}
.tab[aria-current="page"] .ic{transform:translateY(-1px) scale(1.08)}
.addrow{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:1.5px dashed var(--teal-light);border-radius:var(--r);background:#fff;color:var(--teal);font-weight:500;margin-top:4px;transition:transform .15s ease,background .2s ease}
.addrow:active{transform:scale(.98);background:var(--cream)}
.addrow:focus-visible{outline:2px solid var(--amber-dark);outline-offset:2px}
.fab{position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:19;width:58px;height:58px;border-radius:50%;border:none;background:var(--teal);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(34,65,71,.35)}
.fab .ic{width:26px;height:26px}
.fab:focus-visible{outline:2px solid var(--amber-dark);outline-offset:3px}
.mic.rec{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.sq{padding-inline:11px}
.btn.sq .ic{margin:0}
.draftbox{position:relative}
.draftbox textarea{padding-right:54px}
.draftbox .mic{position:absolute;right:6px;top:6px;min-height:40px}
details.mini > summary{font-size:13.5px;color:var(--fg)}
.band .flame .f1,.illu .f1{transform-box:fill-box;transform-origin:50% 100%}
.band .flame .f2,.illu .f2{transform-box:fill-box;transform-origin:50% 100%}
.illu .rays{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  .bar .fill,.mrow .fill,.prog i{transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .ring circle{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1),stroke .3s}
  #view.enter > *{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
  #view.enter > :nth-child(2){animation-delay:.06s} #view.enter > :nth-child(3){animation-delay:.12s} #view.enter > :nth-child(4){animation-delay:.18s}
  #view.enter > :nth-child(5){animation-delay:.24s} #view.enter > :nth-child(6){animation-delay:.3s} #view.enter > :nth-child(n+7){animation-delay:.36s}
  #view.enter[data-dir="fwd"] > *{animation-name:slideL} #view.enter[data-dir="back"] > *{animation-name:slideR}
  #view.enter > .fab{animation:pop .5s .35s cubic-bezier(.3,1.6,.4,1) both}
  .item.fresh{animation:fresh .9s cubic-bezier(.2,.8,.2,1) both}
  .toast{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
  .sheet.opening{animation:up .42s cubic-bezier(.2,.9,.25,1) both} .scrim.opening{animation:fade .3s ease both}
  .sheet.closing{animation:down .22s ease-in both} .scrim.closing{animation:fade .22s ease reverse both}
  .sheet.opening .in > *{animation:rise .45s cubic-bezier(.2,.8,.2,1) both} .sheet.opening .in > :nth-child(3){animation-delay:.05s} .sheet.opening .in > :nth-child(4){animation-delay:.1s} .sheet.opening .in > :nth-child(n+5){animation-delay:.15s}
  details[open]:not(.noanim) > :not(summary){animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
  .btn{transition:transform .15s ease,box-shadow .15s ease,background .2s ease,color .2s ease}
  .btn.primary:active{transform:translate(4px,4px);box-shadow:0 0 0 0 #fff,0 0 0 1px var(--teal)}
  .btn:not(.primary):active,.chip:active,.tile:active,.add:active,.sug:active{transform:scale(.97)}
  .chip,.tile,.sug{transition:transform .15s ease,background .2s ease,color .2s ease}

// Trouve la ligne Ciqual d'un texte libre : mot du quotidien d'abord, puis recherche plein texte.
function resolveFood(q){
  if(!DB.ready) return null;
  const qt=toks(q); if(!qt.length) return null;
  let best=null, bl=0, exact=null;
  for(const a of DB.alias) for(const k of a.keys){
    if(k.every(t=>qt.includes(t))){ if(k.length===qt.length) exact=a; if(k.length>bl){bl=k.length;best=a;} }
  }
  if(exact) return {i:exact.i, u:exact.u};
  const s=searchFoods(DB.idx,q,1,DB.groups)[0];
  if(s && s.full) return {i:s.i, u:DB.portion.get(s.i)||(best?best.u:100)};
  if(best) return {i:best.i, u:best.u};
  if(s) return {i:s.i, u:DB.portion.get(s.i)||100};
  return null;
}
function suggest(q){
  if(!DB.ready||norm(q).length<2) return [];
  const out=[], seen=new Set(), qt=toks(q);
  for(const a of DB.alias) if(a.keys.some(k=>qt.every(t=>k.some(kt=>kt.startsWith(t)))) && !seen.has(a.i)){ seen.add(a.i); out.push({i:a.i,u:a.u}); if(out.length>=3) break; }
  for(const e of searchFoods(DB.idx,q,10,DB.groups)) if(!seen.has(e.i)){ seen.add(e.i); out.push({i:e.i,u:DB.portion.get(e.i)||100}); }
  return out.slice(0,8);
}

const JOB = {assis:1.2, mixte:1.35, physique:1.5};
const MET = {leger:4, mod:6, intense:8.5};
function compute(pr){
  const w=+pr.w||0, h=+pr.h||0, age=+pr.age||0, bf=+pr.bf||0;
  const bmr = bf>3 ? 370+21.6*w*(1-bf/100) : 10*w+6.25*h-5*age+(pr.sex==="h"?5:-161);
  const base = bmr*(JOB[pr.job]||1.2);
  const commute = 2.5*w*(+pr.commute||0)/60;
  const sport = (+pr.sessions||0)*(+pr.dur||0)/60*((MET[pr.intensity]||6)-1)*w/7;
  const tdee = (+pr.tdeeReal>800 ? +pr.tdeeReal : base+commute+sport);
  const adjPct = pr.goal==="perte" ? (pr.pace==="soutenu"?-0.20:-0.12) : pr.goal==="prise" ? (pr.pace==="soutenu"?0.12:0.07) : 0;
  let target = tdee*(1+adjPct);
  if (target<bmr) target=bmr;
  const bmi = h ? w/Math.pow(h/100,2) : 0;
  const refW = bmi>27 ? 25*Math.pow(h/100,2) : w;
  const pPerKg = pr.goal==="perte"?2 : pr.goal==="prise"?1.8 : 1.6;
  const p = pPerKg*refW;
  const l = Math.max(0.8*refW, target*0.30/9);
  const c = Math.max(0,(target-p*4-l*9)/4);
  const weekly = (target-tdee)*7/7700;
  const tw=+pr.targetW||0; let weeks=null;
  if(tw && weekly && Math.sign(tw-w)===Math.sign(weekly)) weeks=Math.ceil((tw-w)/weekly);
  return {bmr, base, commute, sport, tdee, target, p, l, c, fiber: Math.max(25, target/1000*14), bmi, pPerKg, refW, weekly, weeks, dayBase: base+commute, formula: base+commute+sport, water: pr.sex==="h"?2000:1600};
}

const NUMW = {un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6};
const num = v => { const x=parseFloat(String(v==null?"":v).replace(",",".")); return isFinite(x)?x:0; };
const QW=/^(un|une|deux|trois|quatre|cinq|six)$/, UW=/^(kg|g|gr|grammes?|ml|cl|l|litres?|c\.?|cas|cac|cuill[èe]res?|à|a|soupe|caf[ée]|s\.?|tranches?|bols?|verres?|tasses?|poign[ée]es?|portions?|parts?|carr[ée]s?|boules?|canettes?|pintes?|assiettes?|de|du|des|d|%)$/;
const bare = w => w.toLowerCase().replace(/^d['’]/,"");
const isU = (ws,i) => { const lw=bare(ws[i]); return /^(soupe|caf[ée])$/.test(lw) ? (i>0 && /^[àa]$/.test(bare(ws[i-1]))) : UW.test(lw); };
// Découpe une description libre (tapée ou dictée, avec ou sans virgules) en aliments.
function splitMeal(t){
  const out=[], pre=t.replace(/½/g,"0.5").replace(/\b(?:une?\s+)?demie?\b/gi,"0.5").replace(/(\d),(\d)/g,"$1.$2");
  for(const part of pre.split(/[;\n+,]|\s+et\s+|\s+puis\s+/)){
    let cur=[], named=false; const ws=part.trim().split(/\s+/).filter(Boolean);
    ws.forEach((w,i)=>{ const lw=bare(w), isQ=(/^\d/.test(lw)&&!/%$/.test(lw)&&ws[i+1]!=="%")||QW.test(lw);
      if(isQ && named){ out.push(cur.join(" ")); cur=[]; named=false; }
      cur.push(w); if(!isQ && !isU(ws,i) && !/^\d/.test(lw)) named=true; });
    if(cur.length) out.push(cur.join(" "));
  }
  const res=[]; // une quantité seule se rattache à l'aliment qui la précède
  for(const seg of out){ const sw=seg.split(/\s+/), named=sw.some((w,i)=>{ const lw=bare(w); return !/^\d/.test(lw)&&!QW.test(lw)&&!isU(sw,i); });
    if(named) res.push(seg); else if(res.length && !/\d/.test(res.at(-1))) res[res.length-1]+=" "+seg; }
  return res;
}
function parseLine(seg){
  let s=" "+seg.trim().toLowerCase().replace(/(\d),(\d)/g,"$1.$2").replace(/1\/2/g,"0.5")+" ";
  let qty=null, unit=null, rest=s;
  const U="c\\.?\\s?(?:à|a)\\s?s(?:oupe)?\\.?|cuill(?:è|e)res?\\s(?:à|a)\\ssoupe|c\\.?\\s?(?:à|a)\\s?c(?:af(?:é|e))?\\.?|cuill(?:è|e)res?\\s(?:à|a)\\scaf(?:é|e)|cas|cac|tranches?|bols?|verres?|tasses?|poign(?:é|e)es?|portions?|parts?|carr(?:é|e)s?|boules?|canettes?|pintes?|assiettes?";
  const m=s.match(new RegExp("(?<![\\d.])(\\d+(?:\\.\\d+)?)(?![\\d.]*\\s*%)\\s*(kg|grammes?|gr|g|ml|cl|l|"+U+")?(?=\\s|$)"));
  if(m){ qty=+m[1]; unit=m[2]||null; rest=s.replace(m[0]," "); }
  else { const w=s.match(new RegExp("\\s(un|une|deux|trois|quatre|cinq|six)\\s+(?:("+U+")\\s)?"));
    if(w){ qty=NUMW[w[1]]; unit=w[2]||null; rest=s.replace(w[0]," "); } }
  const name=rest.replace(/\s(de|d'|du|des)\s/," ").trim() || seg.trim();
  const fd=resolveFood(name), fname=fd?DB.foods[fd.i][0]:"", fat=fd?(DB.foods[fd.i][2][KI.l]||0):0;
  let g; const u=(unit||"").replace(/\.|\s/g,"");
  if(/^(g|gr|gramme|grammes)$/.test(u)) g=qty;
  else if(u==="kg") g=qty*1000; else if(u==="ml") g=qty; else if(u==="cl") g=qty*10; else if(u==="l") g=qty*1000;
  else if(/^(cas|c[àa]s)/.test(u)||/soupe/.test(unit||"")) g=qty*(fat>60?12:15);
  else if(/^(cac|c[àa]c)/.test(u)||/caf/.test(unit||"")) g=qty*5;
  else if(/^bol/.test(u)||/^assiette/.test(u)) g=qty*300;
  else if(/^verre/.test(u)) g=qty*(/^Vin/.test(fname)?125:200);
  else if(/^tasse/.test(u)) g=qty*(/^Café exp/.test(fname)?50:200);
  else if(/^poign/.test(u)) g=qty*30; else if(/^carr/.test(u)) g=qty*10; else if(/^boule/.test(u)) g=qty*60;
  else if(/^canette/.test(u)) g=qty*330; else if(/^pinte/.test(u)) g=qty*500;
  else if(/^tranche/.test(u)) g=qty*(fd?Math.min(fd.u,40):30);
  else g=(qty==null?1:qty)*(fd?fd.u:150);
  g=Math.round(g);
  if(!fd) return {name:seg.trim(), g, n:new Array(NKEYS).fill(null), unknown:true, src:"?"};
  return {name:fname, g, n:vecOf(fd.i,g), src:"ciqual", gi:DB.foods[fd.i][1]};
}

function microRows(t, R, days=1){

function ruleAdvice(t,c){

  const out=[];
  if(rest.kcal<-100) out.push(`Tu as dépassé ta cible de ${r0(-rest.kcal)} kcal. Rien de grave sur une journée : allège le prochain repas (légumes et protéines maigres) et regarde la moyenne de la semaine.`);
  else if(rest.kcal<150) out.push("Tu es sur ta cible calorique.");
  else out.push(`Il te reste environ ${r0(rest.kcal)} kcal.`);
  if(rest.p>20) out.push(`Protéines : il manque ${r0(rest.p)} g. Pistes : ${protIdeas(prof())}.`);
  if(rest.l<-10) out.push("Lipides au-dessus de la cible : surveille huiles, fromage et oléagineux sur le reste de la journée.");
  if(rest.f>10 && t.kcal>c.target*0.5) out.push(`Fibres : encore ${r0(rest.f)} g à trouver. Ajoute des légumes de saison, des légumineuses ou un fruit.`);
  return out.join(" ");
}

function realTdee(){

  const intake=logged.reduce((s,d)=>s+totals(d).kcal,0)/logged.length;
  const dk=S.days[b].weight-S.days[a].weight;
  return {tdee:intake-dk*7700/span, intake, dk, span, n:logged.length};
}

function kichari(){ if(!DB.ready) return null; const n=new Array(NKEYS).fill(0); let g=0;

  return {name:"Kichari maison (1 bol)", g:425, n, src:"ciqual"}; }

const PREV = new Map(); let dirty=false, softT=null;
// Les barres, l'anneau et les chiffres repartent de leur valeur précédente pour s'animer jusqu'à la nouvelle.
function animate(enter){
  document.querySelectorAll("[data-w]").forEach(el=>{ const k=el.dataset.k, to=+el.dataset.w, from=(enter||!k||!PREV.has(k))?(k&&!enter?to:0):PREV.get(k); if(k) PREV.set(k,to);
    if(REDUCED||from===to){ el.style.width=to+"%"; return; } el.style.width=from+"%"; requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.width=to+"%"; })); });
  document.querySelectorAll("[data-dash]").forEach(el=>{ const k=el.dataset.k, to=+el.dataset.dash, from=(enter||!PREV.has(k))?+el.dataset.full:PREV.get(k); PREV.set(k,to);
    if(REDUCED){ el.style.strokeDashoffset=to; return; } el.style.strokeDashoffset=from; requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.strokeDashoffset=to; })); });
  document.querySelectorAll("[data-count]").forEach(el=>{ const k=el.dataset.k, to=+el.dataset.count, from=(enter||!PREV.has(k))?0:PREV.get(k); PREV.set(k,to);
    if(REDUCED||from===to){ el.textContent=Math.round(to); return; } const t0=performance.now(), dur=800;
    const tick=now=>{ const x=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-x,3); el.textContent=Math.round(from+(to-from)*e); if(x<1&&el.isConnected) requestAnimationFrame(tick); }; requestAnimationFrame(tick); });
}

  if(a==="favedit"){ S.favEdit=!S.favEdit; return render(); }
  if(a==="foyer-create"||a==="foyer-join"){ if(!S.profile) return; let code;
    if(a==="foyer-create"){ const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789", r=crypto.getRandomValues(new Uint32Array(6)); code=[...r].map(x=>A[x%A.length]).join(""); }
    else { code=($("#foyerjoin").value||"").toUpperCase().replace(/[^A-Z0-9]/g,""); if(!CODE_RE.test(code)){ S.note="Ce code ne ressemble pas à un code de foyer : 6 lettres ou chiffres."; return render(); } }
    S.profile.foyer=code; store.save("profile",S.profile); S.draftProfile=null; foyerSub(); S.note=a==="foyer-create"?"Foyer créé : partage le code.":"Tu as rejoint le foyer."; return render(); }
  if(a==="foyer-leave"){ delete S.profile.foyer; store.save("profile",S.profile); S.draftProfile=null; foyerSub(); S.note="Tu as quitté le foyer."; return render(); }
  if(a==="foyer-copy"){ const c=S.profile.foyer; navigator.clipboard.writeText(c).then(()=>{ S.note="Code copié."; render(); }).catch(()=>{ const r=document.createRange(), el=$("#foyercode-v"); r.selectNodeContents(el); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); }); return; }
  if(a==="mic") return Mic.toggle();
  if(a==="people"){ S.people=ppl()%6+1; if(S.profile){ S.profile.people=S.people; store.save("profile",S.profile); } return render(); }
  if(a==="share"){ S.share=(S.share||1)%6+1; return render(); }
  if(a==="add"){ const t=(S.draft.trim()||S.q.trim()); if(!t){S.note="Écris ou dicte d'abord ce que tu as mangé.";return render();} S.q="";
    const items=myShare(parseText(t)); addItems(items); const unk=items.filter(i=>i.unknown).length; S.draft="";
    S.note=unk? unk+" aliment(s) non reconnu(s), affiché(s) en rouge."+(AI.ok?" Supprime-les et utilise « Estimer avec Claude » pour les plats composés.":" Cherche-les par leur nom dans la table.") : items.length+" aliment(s) ajouté(s)."; S.sheet=null; return render(); }
  if(a==="ia"){ const t=(S.draft.trim()||S.q.trim()); if(!t){S.note="Écris ou dicte d'abord ce que tu as mangé.";return render();} Mic.stop(); return estimate(t); }
  if(a==="photo") return $("#photo").click();
  if(a==="advice") return askAdvice();
  if(a==="plan") return askPlan();
  if(a==="off") return offSearch();
  if(a==="copyday"){ const y=S.days[addDays(S.date,-1)]; const D=day(); for(const m of y.meals) D.meals.push({...m,id:uid(),n:m.n.slice()}); saveDay(); return render(); }
  if(a==="water+"||a==="water-"){ const D=day(); D.water=Math.max(0,(D.water||0)+(a==="water+"?1:-1)); saveDay(); return render(); }
  if(a==="kichari"){ const K=kichari(); if(K){ S.date=today(); addItems([K]); } go("journal"); S.note="Un bol de kichari ajouté."; return render(); }
  if(a==="addact"){ const i=+$("#act-type").value, min=Math.round(num($("#act-min").value)); if(!min) return; const w=+prof().w;
    day().acts.push({id:uid(), name:ACTS[i][0], min, kcal:(ACTS[i][1]-1)*w*min/60}); saveDay(); S.sheet=null; return render(); }
  if(a==="weight"){ const v=num($("#weight").value); if(!v) return; day().weight=v; saveDay(); S.sheet=null; S.note="Pesée enregistrée."; return render(); }
  if(a==="usereal"){ if(!S.profile) return go("profil"); S.profile.tdeeReal=+b.dataset.v||0; store.save("profile",S.profile); return render(); }
  if(a==="saveprofile"){ const first=!S.profile, p=S.draftProfile; delete p.example; if(S.profile) for(const k of ["foyer","tdeeReal"]){ if(S.profile[k]!=null) p[k]=S.profile[k]; else delete p[k]; } p.people=+p.people||1; S.people=null; S.profile=JSON.parse(JSON.stringify(p)); store.save("profile",S.profile); if(first){ S.step=0; return go("plan"); } S.note="Profil enregistré."; return render(); }
  if(a==="code"){ AI.code=$("#code").value.trim(); store.put("code",AI.code); S.note="Code enregistré."; return render(); }
  if(a==="export"){ const blob=new Blob([JSON.stringify({app:"agni",v:3,profile:S.profile,days:S.days,favs:S.favs})],{type:"application/json"}); const l=document.createElement("a"); l.href=URL.createObjectURL(blob); l.download="agni-"+today()+".json"; l.click(); return; }
  if(a==="reset"){ S.confirmReset=true; return render(); }
  if(a==="reset-no"){ S.confirmReset=false; return render(); }
  if(a==="reset-yes"){ const keys=Object.keys(S.days); S.profile=null; S.days={}; S.favs=[]; S.draftProfile=null; S.confirmReset=false; foyerSub();
    try{ localStorage.removeItem("agni:profile"); localStorage.removeItem("agni:days"); localStorage.removeItem("agni:favs"); }catch(e){}
    if(store.col){ store.col.doc("profile").delete().catch(()=>{}); store.col.doc("favs").delete().catch(()=>{}); keys.forEach(k=>store.col.doc("d-"+k).delete().catch(()=>{})); }
    S.note="Données effacées."; return render(); }
});
const NUMP = new Set(["age","h","w","bf","commute","sessions","dur","targetW"]);
document.addEventListener("input", e=>{
  const el=e.target;
  if(el.id==="draft"){ S.draft=el.value; return; }
  if(el.id==="offq"){ S.offq=el.value; return; }
  if(el.id==="q"){ S.q=el.value; const box=$("#sugbox"); if(box) box.innerHTML=sugBox(); return; }   // le champ lui-même n'est jamais recréé
  if(el.dataset.p && S.draftProfile){ const k=el.dataset.p; S.draftProfile[k]= NUMP.has(k) ? (el.value.trim()===""?"":num(el.value)) : el.value; S.note=""; }
});
document.addEventListener("change", e=>{
  const el=e.target;
  if(el.dataset.p) return softRender();
  if(el.dataset.g){ const m=day().meals.find(x=>x.id===el.dataset.g); const g=Math.max(0,Math.round(num(el.value))); if(!m) return;
    if(m.g>0&&!m.unknown){ const k=g/m.g; m.n=m.n.map(v=>v==null?null:v*k); } m.g=g; saveDay(); return softRender(); }
  if(el.id==="photo" && el.files[0]){ const f=el.files[0]; el.value=""; shrink(f).then(b=>estimate(S.draft.trim(), b)); }
  if(el.id==="import" && el.files[0]){ el.files[0].text().then(t=>{ const d=JSON.parse(t); if(d.app!=="agni") throw 0; S.profile=d.profile||null; S.days=d.days||{}; S.favs=Array.isArray(d.favs)?d.favs:S.favs; Object.values(S.days).forEach(fixDay); store.put("profile",S.profile); store.put("days",S.days); store.put("favs",{list:S.favs}); S.draftProfile=null; S.note="Données restaurées."; render(); }).catch(()=>{ S.note="Ce fichier n'est pas une sauvegarde Agni."; render(); }); }
});
document.addEventListener("focusout", ()=>{ if(dirty) softRender(); });
window.addEventListener("scroll", ()=>{ $("#band").classList.toggle("small", window.scrollY>12); }, {passive:true});
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.id==="offq"){ e.preventDefault(); offSearch(); }
  if(e.key==="Enter" && e.target.id==="q"){ e.preventDefault(); const f=$("#sugbox .sug"); if(f) f.click(); }
  if(e.key==="Enter" && e.target.dataset && e.target.dataset.g){ e.target.blur(); }
  if(e.key==="Escape" && S.sheet) closeSheet(); });
window.addEventListener("hashchange", ()=>{ const h=location.hash.slice(1); if(TABS.includes(h)&&h!==S.tab){ S.tab=h; S.draftProfile=null; S.sheet=null; render(false,true); } });

/* ================= Démarrage ================= */
S.profile = store.get("profile"); S.days = store.get("days") || {}; S.favs = ((store.get("favs")||{}).list)||[]; Object.values(S.days).forEach(fixDay);
{ const h=location.hash.slice(1); S.tab = TABS.includes(h) ? h : (S.profile?"journal":"profil"); }
$("#tabs").innerHTML = '<i class="ind"></i>' + [["journal","Journal","bowl"],["suivi","Suivi","chart"],["plan","Plan","leaf"],["profil","Profil","person"]].map(([k,l,ic])=>`<button class="tab" data-tab="${k}">${I[ic]}${l}</button>`).join("");
if(STANDALONE && (window.SpeechRecognition||window.webkitSpeechRecognition)) Mic.ok=true;
render(false,true); loadDB();
(async()=>{
  if(STANDALONE){
    AI.code=store.get("code");
    try{ const r=await fetch("api/claude"); if(r.ok){ const d=await r.json(); if(d.ok){ AI.ok=true; AI.img=true; AI.needsCode=!!d.needsCode; softRender(); } } }catch(e){}
    return;
  }
  claude.use("sample").then(async s=>{ if(!s) return; AI.sample=s; AI.ok=true; const lim=await s.limits().catch(()=>null); AI.img=!!(lim&&lim.images); softRender(); });
  claude.use("dictation").then(d=>{ if(!d) return; Mic.cap=d; Mic.ok=true; d.onPartial(({text})=>Mic.show(text)); d.onFinal(({text})=>{ Mic.fin+=text+" "; Mic.show(""); }); d.onState(({state})=>{ Mic.on=state!=="idle"; Mic.paint(); }); softRender(); });
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]); if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const col=db.collection("data/users/"+id), snap=await col.get();
    let remoteProfile=null; const remoteDays={};
    let remoteFavs=null; snap.docs.forEach(d=>{ if(d.id==="profile") remoteProfile=d.data(); else if(d.id==="favs") remoteFavs=d.data().list; else if(d.id.startsWith("d-")) remoteDays[d.id.slice(2)]=d.data(); });
    store.col=col;
    // Le compte fait foi ; ce qui n'existe que sur l'appareil est remonté.
    if(remoteProfile) { S.profile=remoteProfile; store.put("profile",S.profile); } else if(S.profile) store.save("profile",S.profile);
    for(const k of Object.keys(S.days)) if(!remoteDays[k] && (S.days[k].meals.length||S.days[k].acts.length||S.days[k].weight||S.days[k].water)) store.save("d-"+k,S.days[k]);
    for(const k of Object.keys(remoteDays)) S.days[k]=fixDay(remoteDays[k]);
    if(Array.isArray(remoteFavs)){ S.favs=remoteFavs; store.put("favs",{list:S.favs}); } else if(S.favs.length) saveFavs();
    store.put("days",S.days); setSync("Synchronisé");
    FOYER.db=db; FOYER.uid=id; foyerSub();
    if(!location.hash && S.profile && !S.draftProfile && !S.sheet) S.tab="journal"; softRender();
  }catch(e){ setSync("Sur cet appareil"); }
})();
</script>
