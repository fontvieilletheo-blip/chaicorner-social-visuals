<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>AV-S08 · Reel — J'ai créé ça pour vous</title>
<style>
/* ============================================================
   CHAÏ CORNER — Design System posts Instagram
   D'après la charte observée sur @chaicorner.ste + @agatheveillith
   Slides au format 1080 × 1350 (portrait 4:5, optimal feed)
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,500&family=Work+Sans:wght@300;400;500;600&family=Caveat:wght@500;600;700&display=swap');

:root {
  /* Palette commune (charte chaude) */
  --teal: #224147;
  --teal-deep: #16302f;
  --cream: #fdf9f1;
  --cream-2: #f5ede0;
  --terracotta: #c0673f;
  --terracotta-soft: #d98c63;
  --butter: #f2c94c;
  --blush: #f4c9c1;
  --pink: #f29ca8;
  --sage: #9cae8a;
  --ink: #2b2521;

  /* Accent perso Agathe */
  --orange: #e8732a;
  --orange-deep: #c85a18;

  --serif: 'Playfair Display', Georgia, serif;
  --sans: 'Work Sans', system-ui, sans-serif;
  --hand: 'Caveat', cursive;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #3a3a3a;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  padding: 40px;
  font-family: var(--sans);
}

/* Étiquette au-dessus de chaque slide (non exportée) */
.slide-label {
  color: #fff;
  font-family: var(--sans);
  font-size: 15px;
  opacity: 0.7;
  margin-top: 10px;
}

/* ===== SLIDE : conteneur exact 1080×1350 ===== */
.slide {
  width: 1080px;
  height: 1350px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 110px 96px;
  font-family: var(--sans);
  color: var(--ink);
  background: var(--cream);
}

/* Variante STORY 9:16 (1080×1920) */
.slide.slide-story { width: 1080px; height: 1920px; padding: 150px 96px; }

/* ===== THÈMES ===== */
.theme-brand   { --accent: var(--teal); --accent-2: var(--terracotta); }
.theme-agathe  { --accent: var(--orange); --accent-2: var(--teal); }

/* ===== FONDS ===== */
.bg-cream      { background: var(--cream); color: var(--ink); }
.bg-teal       { background: var(--teal); color: var(--cream); }
.bg-terracotta { background: var(--terracotta); color: var(--cream); }
.bg-orange     { background: var(--orange); color: var(--cream); }
.bg-sage       { background: var(--sage); color: var(--teal-deep); }
.bg-photo      { background: var(--teal); color: var(--cream); } /* placeholder photo */

/* ===== TYPOGRAPHIE ===== */
.kicker {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 26px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 28px;
}
.bg-teal .kicker, .bg-terracotta .kicker, .bg-orange .kicker { color: var(--butter); }

h1.title {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 92px;
  line-height: 1.05;
  letter-spacing: -1px;
  margin-bottom: 32px;
}
h2.title {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 64px;
  line-height: 1.1;
  margin-bottom: 28px;
}
.lead {
  font-size: 34px;
  line-height: 1.5;
  font-weight: 300;
}
.body {
  font-size: 30px;
  line-height: 1.55;
  font-weight: 300;
}
.body strong { font-weight: 600; }

.hand {
  font-family: var(--hand);
  font-size: 52px;
  font-weight: 600;
  color: var(--accent-2);
  transform: rotate(-3deg);
  display: inline-block;
}

/* Numéro de slide */
.slide-num {
  position: absolute;
  top: 64px; right: 80px;
  font-family: var(--serif);
  font-size: 40px;
  font-weight: 600;
  opacity: 0.35;
}

/* Liste à puces éditoriales */
ul.points { list-style: none; margin-top: 16px; }
ul.points li {
  font-size: 32px;
  line-height: 1.5;
  font-weight: 300;
  padding-left: 56px;
  position: relative;
  margin-bottom: 26px;
}
ul.points li::before {
  content: "";
  position: absolute;
  left: 0; top: 16px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--accent-2);
}

/* Marque en pied de slide */
.brand-footer {
  position: absolute;
  bottom: 64px; left: 96px;
  font-family: var(--serif);
  font-weight: 600;
  font-size: 30px;
  letter-spacing: 0.5px;
}
.brand-footer .at { font-family: var(--sans); font-weight: 500; opacity: 0.7; font-size: 24px; }

/* Bouton / CTA pill */
.cta-pill {
  display: inline-block;
  background: var(--accent);
  color: var(--cream);
  font-family: var(--sans);
  font-weight: 600;
  font-size: 32px;
  padding: 26px 48px;
  border-radius: 999px;
  margin-top: 20px;
}
.bg-teal .cta-pill, .bg-orange .cta-pill, .bg-terracotta .cta-pill {
  background: var(--butter); color: var(--teal-deep);
}

/* Placeholder photo */
.photo-ph {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: repeating-linear-gradient(45deg, #2a4d52, #2a4d52 24px, #264449 24px, #264449 48px);
  color: var(--cream); font-size: 30px; font-family: var(--sans); text-align: center;
  padding: 80px; opacity: 0.96;
}
.photo-ph span { max-width: 70%; line-height: 1.5; opacity: 0.85; }

/* Overlay texte sur photo (bas) */
.photo-overlay {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 120px 96px 96px;
  background: linear-gradient(transparent, rgba(22,48,47,0.85));
  color: var(--cream);
}

/* Doodles (SVG inline recommandé ; classes utilitaires) */
.doodle { position: absolute; pointer-events: none; }
.doodle--tr { top: 90px; right: 90px; }
.doodle--bl { bottom: 120px; left: 90px; }

/* Pastille planning (style observé sur le compte) */
.pill {
  display: inline-block; border-radius: 40px; padding: 18px 34px;
  font-family: var(--sans); font-weight: 600; font-size: 28px; margin: 8px;
}
.pill--blush { background: var(--blush); color: var(--teal-deep); }
.pill--butter{ background: var(--butter); color: var(--teal-deep); }
.pill--sage  { background: var(--sage);  color: var(--cream); }

</style>

<!-- ============================================================
     LÉGENDE (caption)
     ============================================================
J'ai gardé ce projet pour moi pendant des mois. Aujourd'hui, j'ai un peu le trac en écrivant ces lignes.

Depuis que j'ai ouvert le Chaï Corner, il y a un message qui revient sans cesse. Des personnes qui ont déménagé, qui vivent loin de Saint-Étienne, ou qui jonglent avec des horaires impossibles — et qui me demandent comment pratiquer avec moi malgré la distance.

Pendant longtemps, je n'ai pas eu de réponse. Et puis j'ai compris que je pouvais leur apporter ce que je donne au studio, autrement.

Alors j'ai filmé mes cours. Pas des vidéos lisses et inaccessibles : ma pratique, telle que je la transmets en vrai, dans la lignée que j'ai reçue de Vijay Kumar à Mysore. Les salutations au soleil, les fondamentaux, le souffle, les conseils que je glisse en cours.

À partir d'aujourd'hui, vous pouvez dérouler votre tapis n'importe où et pratiquer avec moi.

Ce n'est qu'un début. D'autres vidéos arriveront, et bientôt une formule plus complète. Mais je voulais déjà vous ouvrir cette porte.

Le lien est dans ma bio. Et si vous êtes à Saint-Étienne, le studio vous attend toujours — rien ne remplace un vrai cours en petit groupe.

Merci d'être là. 🙏

     ------------------------------------------------------------
     HASHTAGS
     ------------------------------------------------------------
#ashtangayoga #ashtanga #yogaenligne #yogasaintetienne #saintetienne #yogaloire #mysorestyle #yogatraditionnel #pratiquechezsoi #yoga #yogafrance #yogapratique #chaicorner
     ============================================================ -->
</head>
<body>

<!-- ============ COUVERTURE DU REEL (vignette) — hook en gros, fond orange ============ -->
<div class="slide-label">AV-S08 · Couverture reel · thème Agathe · fond orange</div>
<section class="slide theme-agathe bg-orange">
  <p class="kicker">Un grand jour</p>
  <h1 class="title">J'ai créé ça<br>pour vous.</h1>
  <p class="lead" style="color:var(--cream);">Pendant des mois, j'ai filmé quelque chose en secret. Aujourd'hui, je peux enfin vous le dire.</p>
  <p class="hand" style="color:var(--butter);margin-top:44px;">regarde →</p>
  <div class="brand-footer" style="color:var(--cream);">Agathe Veillith <span class="at" style="color:var(--cream);opacity:.85;">@agatheveillith</span></div>
  <!-- doodle étoile (signature Agathe) -->
  <svg class="doodle doodle--tr" width="110" height="110" viewBox="0 0 24 24" fill="none">
    <path d="M12 2.5l2.4 6.1 6.6.3-5.1 4.1 1.7 6.4L12 16.9 6.4 19.4l1.7-6.4-5.1-4.1 6.6-.3z" fill="#f2c94c"/>
  </svg>
</section>
